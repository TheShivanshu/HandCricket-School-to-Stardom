name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build the web part (embed fonts, back button)
        run: node build-www.js

      - name: Create the Android project
        run: npx cap add android

      - name: Icon and splash screen
        run: npx --yes @capacitor/assets@3.0.5 generate --android

      - name: Portrait and colours
        run: python3 patch-android.py

      - name: Sync
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: HandCricket-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
